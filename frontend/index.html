<!doctype html>

  <head>
    <!-- ═══ PERFORMANCE: Critical preconnects — must be first ════════════════ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- ═══ NON-RENDER-BLOCKING FONT LOAD ════════════════════════════════════
         The media="print" trick loads the stylesheet async then swaps to all.
         This eliminates the render-blocking font request entirely.            -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800;900&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800;900&display=swap" />
    </noscript>

    <!-- ═══ CRITICAL FONT FALLBACK (prevents invisible text flash) ═══════════ -->
    <style>
      /* Prevent invisible text while web font loads */
      body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      h1, h2, h3, h4, h5, h6, .font-montserrat, [class*="font-['Montserrat']"] {
        font-family: 'Montserrat', 'Arial Black', Arial, sans-serif;
      }
    </style>

    <!-- ═══ GOOGLE TAG MANAGER — deferred 4s to not block TBT ════════════════ -->
    <script>
      window.addEventListener('load', function() {
        setTimeout(function() {
          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
          new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
          j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
          'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
          })(window,document,'script','dataLayer','GTM-WQK58K2C');
        }, 4000);
      });
    </script>
